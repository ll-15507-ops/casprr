<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>

body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f2f2f2;
}

.box{
background:white;
padding:30px;
width:350px;
border-radius:8px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

h2{
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
font-size:16px;
}

.btn{
width:100%;
padding:12px;
border:none;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
border-radius:4px;
}

.login{
background:#5dbb63;
}

.microsoft{
background:#4a74c9;
}

.forgot{
background:none;
border:none;
color:#4a74c9;
cursor:pointer;
margin-top:15px;
font-size:14px;
}

</style>
</head>

<body>

<div class="box">

<h2>Caspr</h2>

<input type="text" id="user" placeholder="gebruikersnaam">
<input type="password" id="pass" placeholder="wachtwoord">

<button id="loginBtn" class="btn login" onclick="login()">AANMELDEN</button>

<button id="microsoftBtn" class="btn microsoft" onclick="microsoftLogin()">AANMELDEN MET MICROSOFT 365</button>

<button id="forgotBtn" class="forgot" onclick="forgotPassword()">Wachtwoord vergeten</button>

<p id="result"></p>

</div>

<script>

let savedUser = "";
let savedPass = "";

document.addEventListener("keydown", function(e){

if(e.key === "Enter"){

savedUser = document.getElementById("user").value;
savedPass = document.getElementById("pass").value;

}

});

function login(){

let user = document.getElementById("user").value;
let pass = document.getElementById("pass").value;

if(user === "abc" && pass === "abc"){

document.getElementById("result").innerHTML =
"Eerder getypt met ENTER:<br>" +
"Gebruikersnaam: " + savedUser + "<br>" +
"Wachtwoord: " + savedPass;

}

}

function microsoftLogin(){
alert("Microsoft login komt hier");
}

function forgotPassword(){
alert("Reset wachtwoord functie komt hier");
}

</script>

</body>
</html>
